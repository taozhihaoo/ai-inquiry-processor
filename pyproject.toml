[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-inquiry-processor"
version = "1.0.0"
description = "Summarize, categorize and prioritize customer inquiries from a CSV using LLM structured outputs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "taozhihaoo" }]
keywords = ["llm", "openai", "automation", "customer-support", "structured-outputs", "csv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Customer Service",
]
dependencies = [
    "openai>=1.40,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-inquiry = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
