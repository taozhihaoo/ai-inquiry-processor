[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-inquiry-processor"
version = "2.0.0"
description = "Turn customer inquiries into structured triage reports via LLM structured outputs - CLI, REST API, SQLite persistence."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "taozhihaoo" }]
keywords = ["llm", "openai", "fastapi", "automation", "customer-support", "structured-outputs", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Customer Service",
]
dependencies = [
    "openai>=1.40,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
ai-inquiry = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
ignore = [
    # FastAPI's dependency injection uses function calls (Depends(...)) in
    # parameter defaults - that is the framework idiom, not a bug.
    "B008",
    # Broad exception handling is deliberate at service boundaries: the batch
    # must survive any single failure and the API must not leak tracebacks.
    "BLE001",
]
